<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞书 · lark-twin</title>
  <link rel="icon" type="image/svg+xml" href="/static/feishu.svg">
  <link rel="stylesheet" href="/static/messenger.css">
</head>
<body>
  <div class="fs">
    <nav class="rail" id="rail">
      <div class="rail-me" id="me"></div>
      <a class="rail-item" href="#/im" data-tab="im">
        <svg viewBox="0 0 24 24"><path d="M4.5 4.5h15a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5v-3.5h-1A1.5 1.5 0 0 1 3 16V6a1.5 1.5 0 0 1 1.5-1.5z"/></svg>
        <span>消息</span><i class="rail-badge" id="unreadAll" hidden></i>
      </a>
      <a class="rail-item" href="#/twin" data-tab="twin">
        <svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M12 5h.01M9 13h.01M15 13h.01M9.5 16h5"/></svg>
        <span>数字人</span>
      </a>
      <div class="rail-grow"></div>
      <button class="rail-item" id="theme" title="切换深浅色">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <span>外观</span>
      </button>
    </nav>

    <section class="tab" id="tab-im">
      <aside class="feed">
        <div class="feed-head">
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
            <input id="q" type="text" placeholder="搜索" autocomplete="off">
          </label>
        </div>
        <div class="feed-filter" id="filters"></div>
        <div class="feed-list" id="feedList"></div>
      </aside>
      <main class="chat" id="chat"></main>
      <aside class="thread-panel" id="thread" hidden></aside>
    </section>

    <section class="tab" id="tab-twin" hidden>
      <iframe id="twinFrame" title="数字人"></iframe>
    </section>
  </div>

  <div class="login" id="login" hidden>
    <div class="login-card">
      <img src="/static/feishu.svg" alt="" width="40" height="40">
      <h2>登录 lark-twin</h2>
      <p>在服务器上运行 <code>larkx web url</code>，打开它给出的链接；或者把令牌粘贴到这里。</p>
      <div class="login-row"><input id="token" type="password" placeholder="令牌"><button id="loginBtn">登录</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/static/messenger.js"></script>
</body>
</html>
