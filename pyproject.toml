[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "larkx"
version = "3.0.0"
description = "lark-twin: 以本人身份常驻飞书的数字人(larkx CLI + 常驻 agent 会话)"
requires-python = ">=3.10"
dependencies = [
    "loguru==0.7.3",
    "requests==2.31.0",
    "websockets==15.0.1",
    "protobuf==5.29.3",
    "protobuf3-to-dict==0.1.5",
    "SQLAlchemy==2.0.44",
    "qrcode[pil]==8.2",
    "python-dotenv==1.1.0",
    "questionary==2.1.0",
    "claude-agent-sdk==0.2.168",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
mysql = ["PyMySQL==1.1.0"]
dev = ["pytest", "httpx"]

[project.scripts]
larkx = "larkx.cli:main"
# 兼容上游文档和旧脚本里的 lark 命令
lark = "larkx.cli:main"

[tool.setuptools.packages.find]
include = ["larkx*"]

[tool.setuptools.package-data]
"larkx.protocol.proto" = ["cmd_map.json"]
"larkx.agent" = ["templates/CLAUDE.md", "templates/skills/larkx/SKILL.md", "templates/skills/larkx-owner/SKILL.md"]
"larkx.web" = ["static/*"]
